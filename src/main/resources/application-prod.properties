# ------------------------------------------------------------------------------
# Production Profile — 環境変数から機微情報を注入する。
# 起動時: java -Dspring.profiles.active=prod -jar app.jar
# ------------------------------------------------------------------------------

# ------------------------------------------------------------------------------
# Database Settings (PostgreSQL)
# ------------------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.h2.console.enabled=false

# ------------------------------------------------------------------------------
# JPA / Hibernate Settings
# 初回移行のため update を使用。運用開始後はマイグレーションツール導入を推奨。
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# Mail Settings (JavaMailSender) — Amazon SES SMTPインターフェース想定
# ------------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:email-smtp.ap-northeast-1.amazonaws.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 送信元/管理者宛先はSESで検証済みのドメインに合わせる（tokyo-hack-group.com）
app.mail.sender-email=${MAIL_SENDER:noreply@tokyo-hack-group.com}
app.mail.admin-email=${MAIL_ADMIN:admin@tokyo-hack-group.com}

# ------------------------------------------------------------------------------
# File Upload Settings — EBS上の永続化ディレクトリを指す絶対パス
# ------------------------------------------------------------------------------
app.upload.dir=${UPLOAD_DIR:/opt/thg-portal/uploads}

# ------------------------------------------------------------------------------
# Nginx がTLS終端・リバースプロキシを行うため、アプリはlocalhostのみ待受
# ------------------------------------------------------------------------------
server.address=127.0.0.1
server.port=8080
server.forward-headers-strategy=native
