# ------------------------------------------------------------------------------
# Application Server Configuration
# ------------------------------------------------------------------------------
server.port=8080

# ------------------------------------------------------------------------------
# View Resolver Settings (JSP Mapping)
# ------------------------------------------------------------------------------
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# ------------------------------------------------------------------------------
# Database Settings (H2 In-Memory)
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:tokyohackgroup_portal_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ------------------------------------------------------------------------------
# JPA / Hibernate Settings
# Hibernate 6での警告(HHH90000025)を回避するため dialect 明示指定を解除
# OSIV警告を消去し、ビュー描画時の不要なSQL発行を抑止
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# Mail Settings (JavaMailSender)
# ------------------------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=noreply.tokyohackgroup@gmail.com
spring.mail.password=dummy_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true